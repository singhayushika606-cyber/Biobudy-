 <!DOCTYPE html>
<html>
<head>
<title>BioBuddy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;text-align:center;background:#e8f5e9;padding:20px}
h1{color:#2e7d32}
button{background:#2e7d32;color:white;padding:10px 20px;border:none;border-radius:10px}
input{padding:10px;width:80%;border-radius:10px;border:1px solid #ccc}
#ans{background:white;padding:15px;margin-top:15px;border-radius:10px}
</style>
</head>
<body>
<h1>🌱 BioBuddy</h1>
<p>Apna Biology Dost - Kuch bhi pucho!</p>
<input id="q" placeholder="Ex: What is heart?">
<br><br>
<button onclick="ask()">Ask BioBuddy</button>
<div id="ans">Yaha jawab aayega...</div>
<script>
function ask(){
let q=document.getElementById("q").value.toLowerCase();
let ans=document.getElementById("ans");
if(q.includes("heart")) ans.innerText="Dil hamare sharir ka pump hai! Ye khoon ko pure sharir me bhejta hai. Dil ek minute me 72 baar dhadakta hai!";
else if(q.includes("photo")) ans.innerText="Photosynthesis me paudhe suraj ki roshni, paani aur hawa se apna khana banate hai. Ise paudhon ki rasoi kehte hai!";
else if(q.includes("dna")) ans.innerText="DNA hamare sharir ka blueprint hai! Isi se pata chalta hai hamari aankhen kaisi hongi!";
else if(q.includes("cell")) ans.innerText="Cell hamare sharir ki sabse chhoti unit hai! Hamara sharir lakhon cells se bana hai!";
else if(q.includes("blood")) ans.innerText="Blood hamare sharir me oxygen pahunchata hai! Hamare sharir me 5 litre khoon hota hai!";
else if(q.includes("brain")) ans.innerText="Brain hamare sharir ka computer hai! Ye sochna, samajhna aur yaad rakhna control karta hai!";
else if(q.includes("plant")) ans.innerText="Plant suraj ki roshni se apna khana banata hai, isko Photosynthesis kehte hai!";
else if(q.includes("biology")) ans.innerText="Biology jeevon ki padhai hai! Isme hum paudhe, janwar aur insaan ke baare me seekhte hai!";
else ans.innerText="BioBuddy: Tumne pucha - "+q+" . Ye Biology ka bahut acha sawal hai!";
}
</script>
</body>
</html>
